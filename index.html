<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f4" />
  <meta name="description" content="Car Bestie — we remember the boring car stuff, so you don't have to." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhance-v4.css" />
  <title>Car Bestie</title>
  <style>
    .journey-land{min-height:100dvh;background:radial-gradient(circle at 12% 9%,#ffe5ed 0,transparent 28%),radial-gradient(circle at 89% 4%,#ece5ff 0,transparent 24%),#fffaf7;color:#302b31;padding:20px}.journey-land *{box-sizing:border-box}.jl-nav{max-width:1080px;margin:auto;display:flex;justify-content:space-between;align-items:center}.jl-brand{font-size:24px;font-weight:950}.jl-brand span{color:#986d80}.jl-sign{border:0;background:#fff;border-radius:999px;padding:10px 15px;font-weight:900;box-shadow:0 8px 24px #3d273012;cursor:pointer}.jl-hero{max-width:1080px;margin:54px auto 70px;display:grid;grid-template-columns:1.15fr .85fr;gap:58px;align-items:center}.jl-kicker{font-size:11px;font-weight:950;letter-spacing:.1em;color:#986d80}.jl-hero h1{font-size:clamp(46px,6vw,78px);letter-spacing:-.055em;line-height:.98;margin:16px 0}.jl-hero h1 span{background:linear-gradient(90deg,#db678c,#8870d2);-webkit-background-clip:text;color:transparent}.jl-hero-copy>p{max-width:620px;color:#6f6670;font-size:17px;line-height:1.6}.jl-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.jl-badges span{background:#fff;border:1px solid #eee0e5;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.jl-phone{width:min(370px,100%);margin:auto;background:#fff;border:1px solid #eee0e5;border-radius:34px;padding:20px;box-shadow:0 30px 70px #432e3a20;transform:rotate(1deg)}.jl-phone-top{display:flex;justify-content:space-between;font-size:12px;font-weight:900}.jl-phone-car{height:120px;border-radius:22px;background:linear-gradient(135deg,#ffe5ec,#eee9ff);display:grid;place-items:center;font-size:62px;margin:15px 0}.jl-phone h3{margin:8px 0 12px}.jl-status{display:flex;justify-content:space-between;padding:11px 12px;border-radius:16px;margin:8px 0;font-size:12px}.jl-status.ok{background:#e5f5e9}.jl-status.soon{background:#fff0dd}.jl-phone footer{display:flex;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid #eee}.jl-journey{max-width:1080px;margin:0 auto 70px;text-align:center}.jl-journey>small{font-weight:950;letter-spacing:.12em;color:#986d80}.jl-journey>h2{font-size:clamp(34px,5vw,56px);letter-spacing:-.045em;line-height:1.05;margin:10px 0}.jl-stage{position:relative;min-height:360px;margin:28px auto 12px;max-width:760px;outline:none}.jl-card{position:absolute;inset:0;opacity:0;transform:translateX(28px) scale(.98);pointer-events:none;transition:.35s ease;background:rgba(255,255,255,.9);border:1px solid #eee0e5;border-radius:30px;padding:34px;box-shadow:0 18px 50px #4a314015;display:grid;grid-template-columns:1fr 1fr;gap:28px;text-align:left;align-items:center}.jl-card.active{opacity:1;transform:none;pointer-events:auto}.jl-card-icon{font-size:48px}.jl-card span{font-size:10px;font-weight:950;letter-spacing:.1em;color:#9a7182}.jl-card h3{font-size:30px;margin:8px 0;letter-spacing:-.035em}.jl-card p{color:#70666f;line-height:1.55}.jl-demo{background:linear-gradient(135deg,#fff0f4,#f1edff);border-radius:22px;padding:22px;line-height:2;font-size:13px;box-shadow:inset 0 0 0 1px #ffffffaa}.jl-demo b{float:right}.jl-controls{display:flex;justify-content:center;align-items:center;gap:18px}.jl-controls>button{border:1px solid #eadce1;background:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}.jl-dots{display:flex;gap:7px}.jl-dot{border:0;width:8px;height:8px;border-radius:999px;background:#dacbd1;padding:0;cursor:pointer;transition:.2s}.jl-dot.active{width:26px;background:#9b7081}.jl-cta{max-width:820px;margin:0 auto 60px;text-align:center;background:linear-gradient(135deg,#ffe5ee,#eee8ff);border-radius:34px;padding:42px 24px}.jl-cta>div{font-size:34px}.jl-cta h2{font-size:clamp(30px,5vw,48px);letter-spacing:-.045em;margin:8px auto 10px}.jl-cta p{color:#6f6670}.jl-google{border:0;border-radius:18px;background:#302c31;color:#fff;padding:15px 22px;font-weight:900;font-size:15px;cursor:pointer;margin:8px 0 12px}.jl-cta small{display:block;color:#746a72}.jl-foot{text-align:center;color:#8a7d84;font-size:12px;padding:8px 0 20px}
    @media(max-width:760px){.journey-land{padding:16px}.jl-hero{grid-template-columns:1fr;margin:38px auto 52px;gap:30px;text-align:center}.jl-hero h1{font-size:48px}.jl-hero-copy>p{font-size:15px}.jl-badges{justify-content:center}.jl-phone{transform:none}.jl-journey>h2{font-size:38px}.jl-stage{min-height:440px}.jl-card{grid-template-columns:1fr;padding:26px}.jl-card h3{font-size:27px}.jl-demo{min-height:120px}.jl-cta{padding:34px 18px}.jl-google{width:100%}}
  </style>
</head>
<body>
  <div id="app"></div>
  <input id="filePicker" type="file" accept="image/*" capture="environment" hidden />
  <script src="config.js"></script>
  <script src="core-v2.js"></script>
  <script src="ui-v2.js"></script>
  <script src="service-v2.js"></script>
  <script src="social-v2.js"></script>
  <script src="enhance-v4.js"></script>
  <script src="roadtax-v5.js"></script>
  <script>
    login=function(){
      const steps=[
        ['🚗','Add your car','Upload gambar kereta, model dan mileage.','Mimi · Perodua Myvi<br><b>54,320 km</b>'],
        ['🧾','Snap. Save. Done.','Lepas servis, simpan bil dan apa yang ditukar.','Engine oil <b>RM150</b><br>Oil filter <b>RM20</b><hr>Total <b>RM170</b>'],
        ['🔔','We remember for you','Car Bestie email bila servis dah dekat.','Service reminder 🔔<br><strong>Mimi needs a little attention 👀</strong>'],
        ['💸','Know what you paid','Tengok semula harga yang pernah awak bayar.','Jan RM135<br>Jun RM145<br>Aug <b>RM165</b>'],
        ['💬','Mechanic said WHAT? 😭','Tanya komuniti dan cari recommendation workshop.','Anonymous · Kuantan<br><strong>RM280 brake pad okay ke?</strong><br>💬 17 replies']
      ];
      app.innerHTML=`<div class="journey-land">
        <header class="jl-nav"><div class="jl-brand">Car <span>Bestie</span> ♡</div><button class="jl-sign" id="jlSign">Sign in</button></header>
        <section class="jl-hero"><div class="jl-hero-copy"><div class="jl-kicker">YOUR CAR BESTIE, FOR REAL ✨</div><h1>We remember the boring car stuff,<br><span>so you don’t have to.</span></h1><p>Service record, receipt, reminder & community — semua dalam satu tempat yang senang faham.</p><div class="jl-badges"><span>Free to use</span><span>Google login</span><span>Made for Malaysia 🇲🇾</span></div></div><div class="jl-phone"><div class="jl-phone-top"><b>Car Bestie</b><span>MIMI ▾</span></div><div class="jl-phone-car">🚗</div><h3>Mimi is doing good ✨</h3><div class="jl-status ok"><span>Engine oil</span><b>all good</b></div><div class="jl-status soon"><span>Tyres</span><b>check soon 👀</b></div><footer><span>Last service</span><b>RM235</b></footer></div></section>
        <section class="jl-journey"><small>HOW IT WORKS</small><h2>Your whole car journey,<br>without the headache.</h2><p>Swipe the cards 👇</p><div class="jl-stage" id="jlStage" tabindex="0">${steps.map((s,i)=>`<article class="jl-card ${i===0?'active':''}" data-card="${i}"><div><div class="jl-card-icon">${s[0]}</div><span>0${i+1}</span><h3>${s[1]}</h3><p>${s[2]}</p></div><div class="jl-demo">${s[3]}</div></article>`).join('')}</div><div class="jl-controls"><button id="jlPrev">←</button><div class="jl-dots">${steps.map((_,i)=>`<button class="jl-dot ${i===0?'active':''}" data-dot="${i}"></button>`).join('')}</div><button id="jlNext">→</button></div></section>
        <section class="jl-cta" id="jlCta"><div>♡</div><h2>Your car records deserve better than the glovebox.</h2><p>Start percuma. Nama & email sahaja melalui Google.</p><button class="jl-google" id="google">G&nbsp;&nbsp; Continue with Google</button><small>Your car records stay yours.</small>${KEY?'':'<div class="notice">Final setup: Supabase publishable key belum dimasukkan.</div>'}</section><footer class="jl-foot">carbestie.my · made with ♡ for everyday drivers</footer></div>`;
      let n=0,cards=[...document.querySelectorAll('.jl-card')],dots=[...document.querySelectorAll('.jl-dot')],sx=0;
      const show=i=>{n=(i+steps.length)%steps.length;cards.forEach((c,j)=>c.classList.toggle('active',j===n));dots.forEach((d,j)=>d.classList.toggle('active',j===n))};
      $('#jlPrev').onclick=()=>show(n-1);$('#jlNext').onclick=()=>show(n+1);dots.forEach(d=>d.onclick=()=>show(Number(d.dataset.dot)));
      $('#jlStage').ontouchstart=e=>sx=e.changedTouches[0].clientX;$('#jlStage').ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)show(n+(dx<0?1:-1))};
      $('#jlStage').onkeydown=e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)};
      $('#jlSign').onclick=()=>$('#jlCta').scrollIntoView({behavior:'smooth'});$('#google').onclick=googleLogin;
    };
  </script>
  <script src="boot-v2.js"></script>
</body>
</html>
